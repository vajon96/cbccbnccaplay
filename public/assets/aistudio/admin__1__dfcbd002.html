<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <h3>Admin Dashboard</h3>
    <input type="text" id="search" class="form-control my-3" placeholder="Search by Name or ID..." onkeyup="searchTable()">
    <table class="table table-bordered" id="adminTable">
        <thead>
            <tr>
                <th>App ID</th>
                <th>Name</th>
                <th>Mobile</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <script>
        // Use the same SCRIPT_URL to fetch data
        async function loadData() {
            const res = await fetch('YOUR_APPS_SCRIPT_URL');
            const data = await res.json();
            const body = document.getElementById('tableBody');
            data.forEach(row => {
                body.innerHTML += `<tr>
                    <td>${row[1]}</td>
                    <td>${row[2]}</td>
                    <td>${row[6]}</td>
                    <td><button class="btn btn-sm btn-primary">View</button></td>
                </tr>`;
            });
        }
        loadData();
    const pass = prompt("Enter Admin Password:");
if (pass !== "admin123") {
    document.body.innerHTML = "Access Denied";
} else {
    loadData();<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<button class="btn btn-success mb-3" onclick="exportToExcel()">Download All as Excel (.xlsx)</button>

<script>
    let allData = [];

    async function loadData() {
        // Now calling your Netlify Function instead of Google Script
        const res = await fetch('/.netlify/functions/register');
        allData = await res.json();
        const body = document.getElementById('tableBody');
        body.innerHTML = allData.map(row => `
            <tr>
                <td>${row.app_id}</td>
                <td>${row.name}</td>
                <td>${row.mobile}</td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="viewAdmitCard('${row.app_id}')">Admit Card</button>
                </td>
            </tr>
        `).join('');
    }

    function exportToExcel() {
        const worksheet = XLSX.utils.json_to_sheet(allData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Registrations");
        XLSX.writeFile(workbook, "Event_Participants_2026.xlsx");
    }
    
    loadData();
</script>
</body>
</html>
