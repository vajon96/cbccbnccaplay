<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="landing-page" class="container text-center py-5">
    <h1 class="mb-4">কমিউনিটি ইভেন্ট রেজিস্ট্রেশন ২০২৬</h1>
    <p>আপনার অংশগ্রহণ নিশ্চিত করতে নিচের বাটনে ক্লিক করে ফর্মটি পূরণ করুন।</p>
    <button class="btn btn-primary btn-lg" onclick="showForm()">Apply Now / আবেদন করুন</button>
</div>

<div id="form-container" class="container d-none">
    <div class="card shadow p-4">
        <h3 class="text-center mb-4">আবেদন ফরম</h3>
        <form id="regForm">
            <div class="step" id="step1">
                <h5>ধাপ ১: ব্যক্তিগত তথ্য</h5>
                <input type="text" name="name" class="form-control mb-2" placeholder="Full Name (English/বাংলা)" required>
                <input type="text" name="father" class="form-control mb-2" placeholder="Father's Name" required>
                <input type="text" name="mother" class="form-control mb-2" placeholder="Mother's Name" required>
                <input type="date" name="dob" class="form-control mb-2" required>
                <button type="button" class="btn btn-next" onclick="nextStep(2)">Next</button>
            </div>

            <div class="step d-none" id="step2">
                <h5>ধাপ ২: যোগাযোগ ও অন্যান্য</h5>
                <input type="tel" name="mobile" class="form-control mb-2" placeholder="Mobile Number" required>
                <textarea name="address" class="form-control mb-2" placeholder="Address (Village, Union, Thana, District)" required></textarea>
                <input type="text" name="nid" class="form-control mb-2" placeholder="NID / Birth Certificate (Optional)">
                <select name="gender" class="form-control mb-2">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
                <div class="d-flex justify-content-between">
                    <button type="button" class="btn btn-secondary" onclick="nextStep(1)">Back</button>
                    <button type="button" class="btn btn-next" onclick="nextStep(3)">Next</button>
                </div>
            </div>

            <div class="step d-none" id="step3">
                <h5>ধাপ ৩: ছবি আপলোড</h5>
                <input type="text" name="religion" class="form-control mb-2" placeholder="Religion">
                <input type="text" name="occupation" class="form-control mb-2" placeholder="Class/Occupation">
                <label>Upload Passport Photo (Base64/Link):</label>
                <input type="file" id="photoInput" class="form-control mb-3" accept="image/*">
                <div class="d-flex justify-content-between">
                    <button type="button" class="btn btn-secondary" onclick="nextStep(2)">Back</button>
                    <button type="submit" class="btn btn-success">Submit Application</button>
                </div>
            </div>
        </form>
    </div>
</div>
<div id="qrcode" style="display:none;"></div>
<div id="success-container" class="container d-none text-center py-5">
    <div class="alert alert-success">আবেদন সফল হয়েছে!</div>
    <h4>Your ID: <span id="displayID"></span></h4>
    <button class="btn btn-info" onclick="generatePDF()">Download Admit Card</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="script.js"></script>
</body>
</html>
