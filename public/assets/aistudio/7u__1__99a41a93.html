<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNCC ID Cards - Cox's Bazar City College</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a4d8f;
            --secondary-color: #d4af37;
            --accent-color: #c8102e;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: var(--dark-color);
            line-height: 1.6;
        }

        /* Header Styles */
        header {
            background: linear-gradient(135deg, var(--primary-color), #0d3a7a);
            color: white;
            padding: 1rem 2rem;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .logo {
            height: 60px;
            width: auto;
        }

        .college-logo {
            height: 70px;
        }

        .header-text {
            text-align: center;
            flex-grow: 1;
        }

        .header-text h1 {
            font-size: 1.8rem;
            margin-bottom: 0.2rem;
        }

        .header-text p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .download-btn {
            background-color: var(--secondary-color);
            color: var(--dark-color);
            padding: 0.7rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .download-btn:hover {
            background-color: #e6c44a;
            transform: translateY(-2px);
        }

        /* Search and Filter */
        .search-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .search-box {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .search-input {
            flex-grow: 1;
            padding: 0.8rem 1.2rem;
            border: 1px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            box-shadow: var(--shadow);
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.5rem 1.2rem;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        /* Profile Grid */
        .profiles-container {
            max-width: 1400px;
            margin: 0 auto 3rem;
            padding: 0 2rem;
        }

        .profiles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .profile-card {
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .profile-photo {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 3px solid var(--primary-color);
        }

        .profile-details {
            padding: 1.5rem;
        }

        .profile-name {
            font-size: 1.4rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .profile-info {
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .profile-info div {
            margin-bottom: 0.3rem;
            display: flex;
        }

        .info-label {
            font-weight: 600;
            min-width: 120px;
        }

        .view-id-btn {
            display: block;
            width: 100%;
            padding: 0.8rem;
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .view-id-btn:hover {
            background-color: #0d3a7a;
        }

        /* ID Card Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal-content {
            background-color: white;
            border-radius: 12px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
        }

        .id-card {
            background: linear-gradient(135deg, #1a4d8f 0%, #0d3a7a 100%);
            color: white;
            padding: 2rem;
            position: relative;
            min-height: 500px;
        }

        .id-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .id-logo {
            height: 50px;
        }

        .id-title {
            text-align: center;
            flex-grow: 1;
        }

        .id-title h2 {
            font-size: 1.2rem;
            margin-bottom: 0.2rem;
        }

        .id-title p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .id-photo-container {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .id-photo {
            width: 120px;
            height: 140px;
            object-fit: cover;
            border: 3px solid white;
            border-radius: 5px;
            background-color: #f0f0f0;
        }

        .id-details {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 1.2rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .id-detail {
            display: flex;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .id-label {
            min-width: 120px;
            font-weight: 600;
        }

        .id-number {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
        }

        /* Footer */
        footer {
            background-color: var(--dark-color);
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: 2rem;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }
            
            .logo-container {
                justify-content: center;
            }
            
            .header-text h1 {
                font-size: 1.5rem;
            }
            
            .profiles-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
        }

        @media (max-width: 768px) {
            .search-box {
                flex-direction: column;
            }
            
            .profiles-grid {
                grid-template-columns: 1fr;
            }
            
            .modal-content {
                max-width: 95%;
            }
        }

        @media (max-width: 576px) {
            header {
                padding: 1rem;
            }
            
            .search-container, .profiles-container {
                padding: 0 1rem;
            }
            
            .college-logo {
                height: 50px;
            }
            
            .logo {
                height: 45px;
            }
        }
    </style>
</head>

        // Function to generate profile cards
        function generateProfileCards() {
            const profilesGrid = document.getElementById('profilesGrid');
            profilesGrid.innerHTML = '';
            
            cadets.forEach(cadet => {
                const fullName = `${cadet.firstName} ${cadet.middleName} ${cadet.lastName}`.trim();
                
                const profileCard = document.createElement('div');
                profileCard.className = 'profile-card';
                profileCard.innerHTML = `
                    <img src="${cadet.photo}" alt="${fullName}" class="profile-photo" onerror="this.src='https://via.placeholder.com/300x220/1a4d8f/ffffff?text=Photo+Not+Available'">
                    <div class="profile-details">
                        <h3 class="profile-name">${fullName}</h3>
                        <div class="profile-info">
                            <div><span class="info-label">Gender:</span> ${cadet.gender}</div>
                            <div><span class="info-label">Blood Group:</span> ${cadet.bloodGroup}</div>
                            <div><span class="info-label">Email:</span> ${cadet.email}</div>
                            <div><span class="info-label">Nationality:</span> ${cadet.nationality}</div>
                            <div><span class="info-label">Mobile:</span> ${cadet.mobile}</div>
                            <div><span class="info-label">Guardian Mobile:</span> ${cadet.guardianMobile}</div>
                            <div><span class="info-label">NID/Birth Cert:</span> ${cadet.nid}</div>
                            <div><span class="info-label">Date of Birth:</span> ${cadet.dob}</div>
                            <div><span class="info-label">Cadet Number:</span> ${cadet.cadetNumber}</div>
                        </div>
                        <button class="view-id-btn" data-cadet-id="${cadet.cadetNumber}">View ID Card</button>
                    </div>
                `;
                
                profilesGrid.appendChild(profileCard);
            });
            
            // Add event listeners to view ID buttons
            document.querySelectorAll('.view-id-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const cadetId = this.getAttribute('data-cadet-id');
                    showIdCard(cadetId);
                });
            });
        }

        // Function to show ID card in modal
        function showIdCard(cadetId) {
            const cadet = cadets.find(c => c.cadetNumber === cadetId);
            if (!cadet) return;
            
            const fullName = `${cadet.firstName} ${cadet.middleName} ${cadet.lastName}`.trim();
            
            const idCardContent = document.getElementById('idCardContent');
            idCardContent.innerHTML = `
                <div class="id-header">
                    <img src="https://i.ibb.co/SBfzG9K/logo-removebg-preview-2.png" alt="College Logo" class="id-logo">
                    <div class="id-title">

                        <p>BNCC - Army Wing</p>
                    </div>
                    <img src="https://i.ibb.co/Fb3R6wR/Bncc-logo.png" alt="BNCC Logo" class="id-logo">
                </div>
                
                <div class="id-photo-container">
                    <img src="${cadet.photo}" alt="${fullName}" class="id-photo" onerror="this.src='https://via.placeholder.com/120x140/1a4d8f/ffffff?text=Photo'">
                </div>
                
                <div class="id-details">
                    <div class="id-detail"><span class="id-label">Name:</span> ${fullName}</div>
                    <div class="id-detail"><span class="id-label">Gender:</span> ${cadet.gender}</div>
                    <div class="id-detail"><span class="id-label">Blood Group:</span> ${cadet.bloodGroup}</div>
                    <div class="id-detail"><span class="id-label">Date of Birth:</span> ${cadet.dob}</div>
                    <div class="id-detail"><span class="id-label">District:</span> ${cadet.district}</div>
                    <div class="id-detail"><span class="id-label">Upazila:</span> ${cadet.upazila}</div>
                </div>
                
                <div class="id-number">
                    Cadet No: ${cadet.cadetNumber}
                </div>
            `;
            
            document.getElementById('idModal').style.display = 'flex';
        }

        // Close modal when clicking the close button
        document.getElementById('closeModal').addEventListener('click', function() {
            document.getElementById('idModal').style.display = 'none';
        });

        // Close modal when clicking outside the modal content
        window.addEventListener('click', function(event) {
            const modal = document.getElementById('idModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            generateProfileCards();
            
            // Add filter functionality
            document.querySelectorAll('.filter-btn').forEach(button => {
                button.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    this.classList.add('active');
                    
                    // In a real implementation, you would filter the profiles here
                    // For this example, we'll just regenerate all cards
                    generateProfileCards();
                });
            });
            
            // Add search functionality
            const searchInput = document.querySelector('.search-input');
            searchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                
                // In a real implementation, you would filter the profiles based on search term
                // For this example, we'll just highlight matching text
                document.querySelectorAll('.profile-card').forEach(card => {
                    const cardText = card.textContent.toLowerCase();
                    if (cardText.includes(searchTerm)) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });
