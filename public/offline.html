<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#002147" />
    <title>অফলাইন | Cox's Bazar City College BNCC Platoon</title>
    <style>
      body {
        margin: 0;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 460px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-top: 6px solid #002147;
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 12px 32px rgba(0, 33, 71, 0.08);
        text-align: center;
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 6px;
        background: #fef3c7;
        color: #92400e;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 22px;
        color: #002147;
        margin: 0 0 12px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #475569;
        margin: 0 0 24px;
      }
      button {
        background: #002147;
        color: #ffffff;
        border: none;
        padding: 12px 24px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">OFFLINE MODE • CBCC BNCC</div>
      <h1>আপনি বর্তমানে অফলাইনে আছেন</h1>
      <p>
        ইন্টারনেট সংযোগ বিচ্ছিন্ন রয়েছে। পূর্বের সংরক্ষিত অফলাইন ফর্ম ও সাধারণ পেজগুলো দেখা যাবে, তবে নতুন সার্ভার সিঙ্ক ও লগইনের জন্য অনুগ্রহ করে পুনরায় সংযোগ দিন।
      </p>
      <button onclick="window.location.reload()">পুনরায় চেষ্টা করুন (Retry)</button>
    </div>
  </body>
</html>
